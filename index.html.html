<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity // Lost in Space</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap');
        
        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #05050a;
            overflow: hidden;
        }
        .orbitron {
            font-family: 'Orbitron', sans-serif;
        }
        /* Glassmorphism UI elements */
        .glass-panel {
            background: rgba(10, 10, 25, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        /* Custom Neon Slider */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 9999px;
            height: 8px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #00f0ff;
            cursor: pointer;
            box-shadow: 0 0 15px #00f0ff, 0 0 30px #00f0ff;
            transition: transform 0.1s;
        }
        input[type="range"]::-webkit-slider-thumb:active {
            transform: scale(1.3);
        }
    </style>
</head>
<body class="text-white h-screen w-screen relative select-none">

    <canvas id="worldCanvas" class="absolute inset-0 w-full h-full z-0"></canvas>

    <div class="absolute inset-0 flex flex-col justify-between p-6 z-10 pointer-events-none">
        
        <header class="flex justify-between items-center w-full pointer-events-auto">
            <div class="flex flex-col">
                <h1 class="orbitron text-3xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-500 drop-shadow-[0_0_15px_rgba(6,182,212,0.5)]">
                    GRAVITY
                </h1>
                <p class="text-xs uppercase tracking-widest text-cyan-400 opacity-80">Atmospheric Calibration OS v1.0</p>
            </div>
            
            <div class="glass-panel px-4 py-2 rounded-xl flex gap-2 items-center">
                <label for="planetSelect" class="text-xs uppercase tracking-wider text-gray-400">Target Destination:</label>
                <select id="planetSelect" class="bg-transparent border-none text-cyan-400 font-bold focus:outline-none cursor-pointer orbitron text-sm">
                    <option value="saturn" class="bg-slate-900 text-white">Saturn</option>
                    <option value="mars" class="bg-slate-900 text-white">Mars</option>
                    <option value="jupiter" class="bg-slate-900 text-white">Jupiter</option>
                    <option value="moon" class="bg-slate-900 text-white">The Moon</option>
                </select>
            </div>
        </header>

        <div id="statusAlert" class="self-center glass-panel px-8 py-4 rounded-2xl border-cyan-500/30 text-center transition-all duration-500 opacity-0 scale-95 transform">
            <h2 id="statusTitle" class="orbitron text-2xl font-bold tracking-wider text-cyan-400">FLOATING CHAOS DETECTED</h2>
            <p id="statusDesc" class="text-sm text-gray-400 mt-1">Calibrate engine slider to match local gravitational pull.</p>
        </div>

        <footer class="w-full max-w-2xl mx-auto pointer-events-auto">
            <div class="glass-panel p-6 rounded-2xl flex flex-col gap-4 border-t border-cyan-500/20">
                <div class="flex justify-between items-center">
                    <div class="flex flex-col">
                        <span class="text-xs uppercase tracking-widest text-gray-400">Current Local Force</span>
                        <span id="gravityDisplay" class="orbitron text-2xl font-bold text-cyan-300">0.00G</span>
                    </div>
                    <div class="text-right flex flex-col">
                        <span class="text-xs uppercase tracking-widest text-gray-400">Required Target</span>
                        <span id="targetDisplay" class="orbitron text-2xl font-bold text-purple-400">1.04G</span>
                    </div>
                </div>

                <div class="relative flex items-center py-2">
                    <input type="range" id="gravitySlider" min="0.0" max="3.0" step="0.01" value="0.1" class="w-full cursor-pointer">
                </div>

                <div class="flex justify-between text-xxs font-mono text-gray-500 uppercase tracking-wider border-t border-white/5 pt-2">
                    <span>SysStatus: Online</span>
                    <span id="stabilizationReadout" class="text-red-400 animate-pulse">Status: Unstable Equilibrium</span>
                    <span>Engine Load: 84.2%</span>
                </div>
            </div>
        </footer>
    </div>

    <script>
        const canvas = document.getElementById('worldCanvas');
        const ctx = canvas.getContext('2d');

        // UI elements
        const planetSelect = document.getElementById('planetSelect');
        const gravitySlider = document.getElementById('gravitySlider');
        const gravityDisplay = document.getElementById('gravityDisplay');
        const targetDisplay = document.getElementById('targetDisplay');
        const statusAlert = document.getElementById('statusAlert');
        const statusTitle = document.getElementById('statusTitle');
        const statusDesc = document.getElementById('statusDesc');
        const stabilizationReadout = document.getElementById('stabilizationReadout');

        // Set Canvas dimensions to take up the whole screen
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // System Configuration Data
        const planets = {
            saturn: { name: 'Saturn', gravity: 1.04, color: '#e2bf7d', sky: 'rgba(20, 15, 30, 0.4)', scale: 180, ring: true },
            mars: { name: 'Mars', gravity: 0.38, color: '#e0533c', sky: 'rgba(30, 10, 10, 0.4)', scale: 120, ring: false },
            jupiter: { name: 'Jupiter', gravity: 2.53, color: '#d8ca9d', sky: 'rgba(25, 20, 15, 0.4)', scale: 240, ring: false },
            moon: { name: 'The Moon', gravity: 0.16, color: '#cccccc', sky: 'rgba(5, 5, 10, 0.4)', scale: 90, ring: false }
        };

        let currentPlanet = planets.saturn;
        let currentGravity = parseFloat(gravitySlider.value);
        let objects = [];
        let particles = [];
        let successFlash = 0;

        // Ground coordinates setup
        const getGroundY = () => canvas.height - 180;

        // Object classes mimicking a floating city landscape
        class CityObject {
            constructor() {
                this.reset();
                // Randomize positions initially across screen height
                this.y = Math.random() * (canvas.height - 300) + 100;
            }

            reset() {
                this.width = Math.random() * 40 + 25;
                this.height = Math.random() * 60 + 40;
                this.x = Math.random() * canvas.width;
                this.y = -this.height;
                this.vx = (Math.random() - 0.5) * 1.5;
                this.vy = 0;
                // Graphic aesthetic parameters
                this.hue = Math.random() * 40 + 190; // Neon cyber shades
                this.type = Math.floor(Math.random() * 3); // 0: Building module, 1: Hover craft, 2: Cyber Citizen
                this.angle = Math.random() * Math.PI * 2;
                this.angularVelocity = (Math.random() - 0.5) * 0.02;
                this.walkCycle = Math.random() * 100;
            }

            update(gravity, isCalibrated) {
                if (isCalibrated) {
                    // CALIBRATED MODE: Normal walking/grounded state mechanics
                    this.angularVelocity *= 0.8; 
                    this.angle *= 0.8; // Align upright
                    
                    let ground = getGroundY() - this.height;
                    
                    if (this.y < ground - 5) {
                        // Falling nicely to landing zones
                        this.vy += gravity * 0.4;
                        this.y += this.vy;
                    } else {
                        // Grounded actions
                        this.y = ground;
                        this.vy = 0;
                        
                        // Cyber walking animations
                        if (this.type === 2) { // Citizen
                            this.x += this.vx * 0.8;
                            this.walkCycle += 0.15;
                        } else if (this.type === 1) { // Hover craft locked down safely
                            this.x += this.vx * 0.3;
                            this.y += Math.sin(Date.now() * 0.005) * 0.5; // micro-hover
                        }
                    }
                } else {
                    // FLOATING CHAOS MODE: Low/unstable gravity floating states
                    let effectiveGravity = gravity - 0.4; // arbitrary offset to create weightless drift dynamics
                    this.vy += effectiveGravity * 0.1;
                    
                    // Add atmospheric friction
                    this.vy *= 0.98;
                    this.vx *= 0.99;

                    this.x += this.vx;
                    this.y += this.vy;
                    this.angle += this.angularVelocity;

                    // Float bounce thresholds from outer bounds
                    if (this.y > canvas.height - 100) {
                        this.vy = -Math.abs(this.vy) * 0.6;
                        this.y = canvas.height - 100;
                    }
                    if (this.y < 50) {
                        this.vy = Math.abs(this.vy) * 0.6;
                    }
                }

                // Screen wrapping logic
                if (this.x + this.width < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = -this.width;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
                ctx.rotate(this.angle);

                let isCalibrated = Math.abs(currentGravity - currentPlanet.gravity) < 0.07;

                // Render vector styling outlines based on asset types
                ctx.lineWidth = 2;
                ctx.shadowBlur = isCalibrated ? 5 : 12;
                ctx.shadowColor = `hsla(${this.hue}, 100%, 60%, 0.6)`;
                ctx.strokeStyle = `hsla(${this.hue}, 100%, 60%, 0.8)`;
                ctx.fillStyle = `hsla(${this.hue}, 80%, 15%, 0.4)`;

                if (this.type === 0) { // Module Tower Block
                    ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);
                    ctx.strokeRect(-this.width/2, -this.height/2, this.width, this.height);
                    // Glowing internal matrix lines
                    ctx.beginPath();
                    ctx.moveTo(-this.width/2 + 5, 0); ctx.lineTo(this.width/2 - 5, 0);
                    ctx.stroke();
                } else if (this.type === 1) { // Cyber Craft Cargo
                    ctx.beginPath();
                    ctx.moveTo(-this.width/2, 0);
                    ctx.lineTo(0, -this.height/2);
                    ctx.lineTo(this.width/2, 0);
                    ctx.lineTo(0, this.height/2);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                } else { // Humanoid Citizen Node
                    let w = this.width * 0.5;
                    let h = this.height * 0.8;
                    ctx.strokeRect(-w/2, -h/2, w, h);
                    ctx.fillRect(-w/2, -h/2, w, h);
                    
                    if (isCalibrated && Math.abs(this.vy) < 0.1) {
                        // Walking leg animations
                        let legAnimation = Math.sin(this.walkCycle) * 10;
                        ctx.beginPath();
                        ctx.moveTo(-w/4, h/2); ctx.lineTo(-w/4 + legAnimation, h/2 + 12);
                        ctx.moveTo(w/4, h/2); ctx.lineTo(w/4 - legAnimation, h/2 + 12);
                        ctx.stroke();
                    }
                }
                ctx.restore();
            }
        }

        // Particle effect module for calibrations
        class Spark {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 8;
                this.vy = (Math.random() - 0.5) * 8;
                this.alpha = 1;
                this.color = Math.random() > 0.5 ? '#00f0ff' : '#a855f7';
                this.size = Math.random() * 3 + 1;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= 0.02;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.restore();
            }
        }

        // Initialize Objects array components
        function initEnvironment() {
            objects = [];
            for (let i = 0; i < 22; i++) {
                objects.push(new CityObject());
            }
        }

        // Trigger explosion animations
        function triggerBurst() {
            for (let i = 0; i < 120; i++) {
                particles.push(new Spark(Math.random() * canvas.width, Math.random() * canvas.height));
            }
        }

        // Main Environment Background Rendering
        function drawBackground() {
            // Stars/Nebula wash
            let gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#040209');
            gradient.addColorStop(1, currentPlanet.sky);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Celestial Body Background Asset
            ctx.save();
            let planetX = canvas.width * 0.75;
            let planetY = canvas.height * 0.35;
            
            ctx.shadowBlur = 60;
            ctx.shadowColor = currentPlanet.color;
            ctx.fillStyle = currentPlanet.color;
            
            // Draw Planet Sphere
            ctx.beginPath();
            ctx.arc(planetX, planetY, currentPlanet.scale, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Optional Ring Drawing styling (for Saturn settings)
            if (currentPlanet.ring) {
                ctx.strokeStyle = 'rgba(226, 191, 125, 0.4)';
                ctx.lineWidth = 18;
                ctx.save();
                ctx.translate(planetX, planetY);
                ctx.scale(2.5, 0.35);
                ctx.rotate(-Math.PI / 8);
                ctx.beginPath();
                ctx.arc(0, 0, currentPlanet.scale + 20, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }
            ctx.restore();

            // Draw Digital Grid Ground Floor Architecture
            ctx.strokeStyle = 'rgba(6, 182, 212, 0.2)';
            ctx.lineWidth = 2;
            let groundY = getGroundY();
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(canvas.width, groundY);
            ctx.stroke();

            // Matrix ground linear depth wires
            for (let i = 0; i < canvas.width; i += 80) {
                ctx.beginPath();
                ctx.moveTo(i, groundY);
                ctx.lineTo(i + (i - canvas.width / 2) * 0.8, canvas.height);
                ctx.stroke();
            }
        }

        // Setup Application Runtime State Flags
        let systemWasCalibrated = false;

        function loop() {
            // Capture delta updates
            currentGravity = parseFloat(gravitySlider.value);
            gravityDisplay.textContent = `${currentGravity.toFixed(2)}G`;
            targetDisplay.textContent = `${currentPlanet.gravity.toFixed(2)}G`;

            // Evaluate calibration state
            let deviation = Math.abs(currentGravity - currentPlanet.gravity);
            let isCalibrated = deviation < 0.07; // Tolerance window

            // Graphic alert systems logic handling transitions
            if (isCalibrated) {
                if (!systemWasCalibrated) {
                    // Sick animation burst phase
                    triggerBurst();
                    successFlash = 15; // Setup flash effect timer frame counter
                    systemWasCalibrated = true;
                }
                statusAlert.classList.remove('opacity-0', 'scale-95', 'border-cyan-500/30');
                statusAlert.classList.add('opacity-100', 'scale-100', 'border-green-500/60');
                statusTitle.textContent = "GRAVITY CALIBRATED";
                statusTitle.className = "orbitron text-2xl font-bold tracking-wider text-green-400 drop-shadow-[0_0_10px_#22c55e]";
                statusDesc.textContent = `Atmosphere locked smoothly at ${currentPlanet.gravity}G. Entities walking.`;
                stabilizationReadout.textContent = "Status: Optimal Stabilization";
                stabilizationReadout.className = "text-green-400";
            } else {
                systemWasCalibrated = false;
                statusAlert.classList.remove('border-green-500/60');
                statusAlert.classList.add('border-cyan-500/30');
                
                if (deviation < 0.3) {
                    statusAlert.classList.remove('opacity-0');
                    statusAlert.classList.add('opacity-100');
                    statusTitle.textContent = "APPROACHING EQUILIBRIUM";
                    statusTitle.className = "orbitron text-2xl font-bold tracking-wider text-yellow-400";
                    statusDesc.textContent = "Structural micro-fluctuations detected. Fine tune control system dials.";
                    stabilizationReadout.textContent = "Status: Realignment In Progress";
                    stabilizationReadout.className = "text-yellow-400 animate-pulse";
                } else {
                    statusAlert.classList.remove('opacity-100');
                    statusAlert.classList.add('opacity-0');
                    stabilizationReadout.textContent = "Status: Unstable Equilibrium";
                    stabilizationReadout.className = "text-red-400 animate-pulse";
                }
            }

            drawBackground();

            // Run structural loops
            objects.forEach(obj => {
                obj.update(currentGravity, isCalibrated);
                obj.draw();
            });

            // Update/Draw bursts
            particles = particles.filter(p => p.alpha > 0);
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            // Screen matrix flash overlay frame step
            if (successFlash > 0) {
                ctx.fillStyle = `rgba(0, 240, 255, ${successFlash / 30})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                successFlash--;
            }

            requestAnimationFrame(loop);
        }

        // Handle Event Configurations updates
        planetSelect.addEventListener('change', (e) => {
            currentPlanet = planets[e.target.value];
            systemWasCalibrated = false;
        });

        // Initialize and kickstart app engine
        initEnvironment();
        loop();
    </script>
</body>
</html>
