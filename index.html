<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity // Cyber System Tour</title>
    <!-- Tailwind CSS for Layout -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap');
        
        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #030308;
            overflow: hidden;
        }
        .orbitron {
            font-family: 'Orbitron', sans-serif;
        }
        .glass-panel {
            background: rgba(10, 10, 20, 0.75);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 40px 0 rgba(0, 0, 0, 0.5);
        }
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.07);
            border-radius: 9999px;
            height: 10px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #a855f7;
            cursor: pointer;
            box-shadow: 0 0 15px #a855f7, 0 0 30px #a855f7;
            transition: transform 0.1s, background-color 0.2s;
        }
        input[type="range"]::-webkit-slider-thumb:active {
            transform: scale(1.25);
        }
        .calibrated-thumb::-webkit-slider-thumb {
            background: #22c55e !important;
            box-shadow: 0 0 20px #22c55e, 0 0 40px #22c55e !important;
        }
    </style>
</head>
<body class="text-white h-screen w-screen relative select-none">

    <!-- Canvas Rendering Engine -->
    <canvas id="worldCanvas" class="absolute inset-0 w-full h-full z-0"></canvas>

    <!-- Top UI Info Bar -->
    <div class="absolute inset-0 flex flex-col justify-between p-6 z-10 pointer-events-none">
        
        <header class="flex justify-between items-start w-full pointer-events-auto">
            <div class="flex flex-col">
                <h1 class="orbitron text-4xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500 drop-shadow-[0_0_20px_rgba(168,85,247,0.4)]">
                    GRAVITY
                </h1>
                <p id="progressionCounter" class="text-xs uppercase tracking-widest text-purple-400 font-bold mt-1">PLANET: 1 / 9</p>
            </div>
            
            <!-- Target System Telemetry Card -->
            <div class="glass-panel px-6 py-3 rounded-2xl flex flex-col items-end border-r-4 border-purple-500">
                <span class="text-xxs uppercase tracking-widest text-gray-400 font-bold">Target Identity</span>
                <span id="planetNameDisplay" class="orbitron text-2xl font-black text-white tracking-wide">SCANNING...</span>
            </div>
        </header>

        <!-- Big Dynamic Notifications Overlay Center Screen -->
        <div id="statusAlert" class="self-center glass-panel px-10 py-6 rounded-3xl border text-center transition-all duration-300 scale-95 opacity-0 border-yellow-500/30">
            <h2 id="statusTitle" class="orbitron text-3xl font-black tracking-widest text-yellow-400">FLOATING CHAOS</h2>
            <p id="statusDesc" class="text-sm text-gray-300 tracking-wide mt-2">Adjust dials to stabilize city metrics.</p>
            <div id="timerContainer" class="w-full bg-white/10 h-1.5 rounded-full mt-4 overflow-hidden hidden">
                <div id="timerBar" class="bg-green-500 h-full w-full transition-all linear"></div>
            </div>
        </div>

        <!-- Lower Dock Interaction Station -->
        <footer class="w-full max-w-2xl mx-auto pointer-events-auto">
            <div class="glass-panel p-6 rounded-2xl flex flex-col gap-4 border-b border-white/5">
                <div class="flex justify-between items-center">
                    <div class="flex flex-col">
                        <span class="text-xs uppercase tracking-widest text-gray-400 font-bold">Current Gauge Pressure</span>
                        <span id="gravityDisplay" class="orbitron text-3xl font-black text-purple-300">0.00G</span>
                    </div>
                    <div class="text-right flex flex-col">
                        <span class="text-xs uppercase tracking-widest text-gray-400 font-bold">Target Range (±2%)</span>
                        <span id="targetRangeDisplay" class="orbitron text-sm font-bold text-gray-400 mt-1">?? - ??</span>
                    </div>
                </div>

                <!-- Main Interactive Input slider -->
                <div class="relative flex items-center py-2">
                    <input type="range" id="gravitySlider" min="0.05" max="3.0" step="0.01" value="0.5" class="w-full cursor-pointer">
                </div>

                <!-- Infrastructure Status Grid footer -->
                <div class="flex justify-between text-xxs font-mono text-gray-500 uppercase tracking-wider border-t border-white/5 pt-3">
                    <span>Core: Connected</span>
                    <span id="telemetryStatus" class="text-red-400 animate-pulse">Atmospheric Shift Active</span>
                    <span>System: 2026.OS</span>
                </div>
            </div>
        </footer>
    </div>

    <script>
        const canvas = document.getElementById('worldCanvas');
        const ctx = canvas.getContext('2d');

        // Capture DOM nodes
        const gravitySlider = document.getElementById('gravitySlider');
        const gravityDisplay = document.getElementById('gravityDisplay');
        const targetRangeDisplay = document.getElementById('targetRangeDisplay');
        const planetNameDisplay = document.getElementById('planetNameDisplay');
        const progressionCounter = document.getElementById('progressionCounter');
        
        const statusAlert = document.getElementById('statusAlert');
        const statusTitle = document.getElementById('statusTitle');
        const statusDesc = document.getElementById('statusDesc');
        const telemetryStatus = document.getElementById('telemetryStatus');
        const timerContainer = document.getElementById('timerContainer');
        const timerBar = document.getElementById('timerBar');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Complete Solar System Parameters array (Randomized sequentially)
        const planetPool = [
            { name: 'Mercury', gravity: 0.38, color: '#9e9e9e', sky: 'rgba(15, 15, 20, 0.45)', radius: 60, ring: false },
            { name: 'Venus',   gravity: 0.90, color: '#e3bb76', sky: 'rgba(40, 25, 10, 0.45)', radius: 100, ring: false },
            { name: 'Earth',   gravity: 1.00, color: '#4b90ff', sky: 'rgba(10, 20, 40, 0.45)', radius: 110, ring: false },
            { name: 'Mars',    gravity: 0.38, color: '#c1440e', sky: 'rgba(35, 12, 5, 0.45)',  radius: 80, ring: false },
            { name: 'Jupiter', gravity: 2.53, color: '#b07f35', sky: 'rgba(30, 20, 15, 0.45)', radius: 210, ring: false },
            { name: 'Saturn',  gravity: 1.04, color: '#e2bf7d', sky: 'rgba(25, 20, 35, 0.45)', radius: 160, ring: true },
            { name: 'Uranus',  gravity: 0.89, color: '#4b70dd', sky: 'rgba(10, 30, 35, 0.45)', radius: 130, ring: true },
            { name: 'Neptune', gravity: 1.14, color: '#274687', sky: 'rgba(5, 15, 45, 0.45)',  radius: 125, ring: true },
            { name: 'Pluto',   gravity: 0.06, color: '#efdac4', sky: 'rgba(8, 8, 12, 0.45)',   radius: 40, ring: false }
        ];

        let levelOrder = [];
        let currentLevelIndex = 0;
        let activePlanet = null;
        
        let entities = [];
        let particles = [];
        
        // Calibration Timers
        let calibrationStartTime = null;
        let isLockPhase = false;
        let greenFlashDuration = 0;

        // Shuffle arrays utility
        function shufflePlanets() {
            let pool = [...planetPool];
            levelOrder = [];
            while(pool.length > 0) {
                let index = Math.floor(Math.random() * pool.length);
                levelOrder.push(pool.splice(index, 1)[0]);
            }
        }

        // Setup a target Level environment
        function loadLevel(index) {
            if (index >= levelOrder.length) {
                shufflePlanets(); // End of game loop, reshuffle fresh cycle
                currentLevelIndex = 0;
            }
            
            activePlanet = levelOrder[currentLevelIndex];
            isLockPhase = false;
            calibrationStartTime = null;
            
            // Reset sliders to completely random non-calibrated states 
            gravitySlider.value = (Math.random() * 2.2 + 0.2).toFixed(2);
            gravitySlider.classList.remove('calibrated-thumb');
            timerContainer.classList.add('hidden');

            // Update UI elements values
            progressionCounter.textContent = `PLANET TOUR: ${currentLevelIndex + 1} / ${levelOrder.length}`;
            planetNameDisplay.textContent = activePlanet.name.toUpperCase();
            
            // Explicitly show ±2% target brackets info to the user
            let minMargin = (activePlanet.gravity * 0.98).toFixed(2);
            let maxMargin = (activePlanet.gravity * 1.02).toFixed(2);
            targetRangeDisplay.textContent = `${minMargin}G - ${maxMargin}G`;

            initEntities();
        }

        // Entity Object Management (aliens, ships, cars)
        class CityEntity {
            constructor() {
                this.type = Math.floor(Math.random() * 3); // 0: Alien Citizen, 1: Aero Cruiser Cargo Ship, 2: Cyber Ground Car
                this.reset(true);
            }

            reset(initialSpawn = false) {
                this.width = this.type === 0 ? 16 : (this.type === 1 ? 75 : 45);
                this.height = this.type === 0 ? 32 : (this.type === 1 ? 24 : 18);
                this.x = Math.random() * canvas.width;
                
                // Spawn locations based on floating state or ground requirements
                let groundBase = canvas.height - 150;
                if (initialSpawn) {
                    this.y = Math.random() * (groundBase - 200) + 100;
                } else {
                    this.y = -this.height;
                }

                this.vx = (Math.random() - 0.5) * 2.5 + (this.type === 1 ? 1.5 : 0.8);
                this.vy = 0;
                this.angle = Math.random() * Math.PI * 2;
                this.angularVel = (Math.random() - 0.5) * 0.04;
                this.hue = Math.floor(Math.random() * 60) + (this.type === 0 ? 120 : (this.type === 1 ? 200 : 280)); // distinct color ranges
                this.walkCycle = Math.random() * 50;
            }

            update(sliderGravity, exactTarget, isPerfect) {
                let groundY = canvas.height - 150 - this.height;

                if (isPerfect) {
                    // CALIBRATED LEVEL STATE: Instant physical conform, lock vertical angles, walk flat.
                    this.angle *= 0.75; // ease to 0 rapidly
                    this.angularVel = 0;

                    if (this.y < groundY - 2) {
                        this.vy += sliderGravity * 0.5;
                        this.y += this.vy;
                        if (this.y >= groundY) {
                            this.y = groundY;
                            this.vy = 0;
                        }
                    } else {
                        // All normal ground activities active
                        this.y = groundY;
                        this.vy = 0;
                        this.x += this.vx * 1.2;
                        this.walkCycle += 0.25;
                    }
                } else {
                    // UNCALIBRATED STATE: Conform instantly based on whether slider is too high or low relative to exact target
                    let disparity = sliderGravity - exactTarget;

                    if (Math.abs(disparity) > 0.01) {
                        // Apply instant float vs crush metrics
                        this.vy += disparity * 0.18;
                        this.y += this.vy;
                        this.x += this.vx * 0.5;
                        this.angle += this.angularVel;
                        
                        // Apply drag dampeners
                        this.vy *= 0.94;
                    }

                    // Strict Collision confines for sky/ground constraints
                    if (this.y > canvas.height - 150 - this.height) {
                        this.y = canvas.height - 150 - this.height;
                        this.vy = -Math.abs(this.vy) * 0.3; // tiny heavy thump bounce
                        this.angularVel *= 0.5;
                    }
                    if (this.y < 40) {
                        this.y = 40;
                        this.vy = Math.abs(this.vy) * 0.3; // roof bounce ceiling pressure mapping
                    }
                }

                // Standard wrap boundary loops
                if (this.x > canvas.width) this.x = -this.width;
                if (this.x + this.width < 0) this.x = canvas.width;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
                ctx.rotate(this.angle);

                ctx.lineWidth = 2;
                ctx.strokeStyle = `hsla(${this.hue}, 100%, 65%, 0.85)`;
                ctx.fillStyle = `hsla(${this.hue}, 90%, 12%, 0.6)`;
                ctx.shadowBlur = isLockPhase ? 6 : 14;
                ctx.shadowColor = `hsla(${this.hue}, 100%, 65%, 0.5)`;

                if (this.type === 0) { // Alien humanoids vector structure
                    ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);
                    ctx.strokeRect(-this.width/2, -this.height/2, this.width, this.height);
                    // Single glowing cyclops eye lens
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(-this.width/4, -this.height/3, this.width/2, 4);
                    
                    if (isLockPhase && Math.abs(this.vy) < 0.1) {
                        ctx.strokeStyle = `hsla(${this.hue}, 100%, 65%, 1)`;
                        let legOffset = Math.sin(this.walkCycle) * 8;
                        ctx.beginPath();
                        ctx.moveTo(-4, this.height/2); ctx.lineTo(-4 + legOffset, this.height/2 + 8);
                        ctx.moveTo(4, this.height/2);  ctx.lineTo(4 - legOffset, this.height/2 + 8);
                        ctx.stroke();
                    }
                } 
                else if (this.type === 1) { // High-Tech Aero Cargo Cruisers
                    ctx.beginPath();
                    ctx.moveTo(-this.width/2, -this.height/6);
                    ctx.lineTo(-this.width/3, -this.height/2);
                    ctx.lineTo(this.width/2, -this.height/4);
                    ctx.lineTo(this.width/3, this.height/2);
                    ctx.lineTo(-this.width/2, this.height/3);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                } 
                else { // Futuristic Ground Pod Cars
                    ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);
                    ctx.strokeRect(-this.width/2, -this.height/2, this.width, this.height);
                    // Glowing energy wheels line mapping
                    ctx.fillStyle = '#00f0ff';
                    ctx.fillRect(-this.width/2.5, this.height/2 - 2, 8, 4);
                    ctx.fillRect(this.width/4, this.height/2 - 2, 8, 4);
                }

                ctx.restore();
            }
        }

        // Spark explosion system
        class NeonSpark {
            constructor(x, y, color) {
                this.x = x; this.y = y;
                this.vx = (Math.random() - 0.5) * 12;
                this.vy = (Math.random() - 0.5) * 12;
                this.alpha = 1;
                this.color = color;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                this.alpha -= 0.025;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, 4, 4);
                ctx.restore();
            }
        }

        function initEntities() {
            entities = [];
            // Generate dense balanced pop structure of aliens, ships, and vehicles
            for (let i = 0; i < 30; i++) {
                entities.push(new CityEntity());
            }
        }

        function triggerSuccessBurst() {
            let colors = ['#22c55e', '#00ffcc', '#ffffff'];
            for (let i = 0; i < 150; i++) {
                particles.push(new NeonSpark(
                    Math.random() * canvas.width, 
                    Math.random() * (canvas.height - 150),
                    colors[Math.floor(Math.random() * colors.length)]
                ));
            }
        }

        // Draw Environment background assets
        function renderSceneBackground() {
            let spaceGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            spaceGrad.addColorStop(0, '#020106');
            spaceGrad.addColorStop(1, activePlanet.sky);
            ctx.fillStyle = spaceGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Render Back Celestial Body
            ctx.save();
            let pX = canvas.width * 0.8;
            let pY = canvas.height * 0.3;
            ctx.shadowBlur = 50;
            ctx.shadowColor = activePlanet.color;
            ctx.fillStyle = activePlanet.color;
            ctx.beginPath();
            ctx.arc(pX, pY, activePlanet.radius, 0, Math.PI * 2);
            ctx.fill();

            if (activePlanet.ring) {
                ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                ctx.lineWidth = 14;
                ctx.save();
                ctx.translate(pX, pY);
                ctx.scale(2.4, 0.4);
                ctx.rotate(-Math.PI/6);
                ctx.beginPath();
                ctx.arc(0,0, activePlanet.radius + 30, 0, Math.PI*2);
                ctx.stroke();
                ctx.restore();
            }
            ctx.restore();

            // Ground floor landscape vectors
            let groundLevel = canvas.height - 150;
            ctx.strokeStyle = isLockPhase ? 'rgba(34, 197, 94, 0.4)' : 'rgba(168, 85, 247, 0.2)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, groundLevel);
            ctx.lineTo(canvas.width, groundLevel);
            ctx.stroke();

            // City Grid baseline vanishing points perspective lines
            ctx.lineWidth = 1;
            for (let xPos = 0; xPos < canvas.width; xPos += 60) {
                ctx.beginPath();
                ctx.moveTo(xPos, groundLevel);
                ctx.lineTo(xPos + (xPos - canvas.width/2) * 1.2, canvas.height);
                ctx.stroke();
            }
        }

        // Central Loop Routine
        function updateLoop() {
            let sliderVal = parseFloat(gravitySlider.value);
            gravityDisplay.textContent = `${sliderVal.toFixed(2)}G`;

            // Calculate precise ±2% threshold windows logic parameters
            let minAllowed = activePlanet.gravity * 0.98;
            let maxAllowed = activePlanet.gravity * 1.02;
            let isWithinTolerance = (sliderVal >= minAllowed && sliderVal <= maxAllowed);

            if (isWithinTolerance) {
                if (!isLockPhase) {
                    // Target hit initiation frame sequence triggers
                    isLockPhase = true;
                    calibrationStartTime = Date.now();
                    greenFlashDuration = 20; // set strobe frames
                    triggerSuccessBurst();
                    gravitySlider.classList.add('calibrated-thumb');
                    timerContainer.classList.remove('hidden');
                }

                let elapsed = Date.now() - calibrationStartTime;
                let remainingProgress = Math.max(0, 100 - (elapsed / 4000) * 100);
                timerBar.style.width = `${remainingProgress}%`;

                // Update UI Alert Panel parameters for success state
                statusAlert.classList.remove('opacity-0', 'scale-95', 'border-yellow-500/30');
                statusAlert.classList.add('opacity-100', 'scale-100', 'border-green-500/70');
                statusTitle.textContent = "WELL DONE!";
                statusTitle.className = "orbitron text-3xl font-black text-green-400 drop-shadow-[0_0_15px_#22c55e]";
                statusDesc.textContent = `Holding precise lock on ${activePlanet.name}. Simulating next hop...`;
                telemetryStatus.textContent = "Atmosphere Stabilized Perfectly";
                telemetryStatus.className = "text-green-400 font-bold";

                // Check if the 4-second confirmation phase is complete
                if (elapsed >= 4000) {
                    currentLevelIndex++;
                    loadLevel(currentLevelIndex);
                    return requestAnimationFrame(updateLoop);
                }
            } else {
                // If they break lock out of the window before the 4 seconds expire, abort sequence
                if (isLockPhase) {
                    isLockPhase = false;
                    calibrationStartTime = null;
                    gravitySlider.classList.remove('calibrated-thumb');
                    timerContainer.classList.add('hidden');
                }

                // Show relative environmental data feed to guide adjustments
                statusAlert.classList.remove('opacity-100', 'scale-100', 'border-green-500/70');
                statusAlert.classList.add('opacity-0', 'scale-95', 'border-yellow-500/30');
                telemetryStatus.textContent = "Atmospheric Shift Active";
                telemetryStatus.className = "text-red-400 animate-pulse";

                // Intuitively display HUD alerts if close to sweet spots
                let diff = sliderVal - activePlanet.gravity;
                if (Math.abs(diff) < 0.4 && Math.abs(diff) > 0.02) {
                    statusAlert.classList.remove('opacity-0');
                    statusAlert.classList.add('opacity-100');
                    statusTitle.textContent = diff > 0 ? "GRAVITY CRUSH" : "ATMOSPHERIC DRIFT";
                    statusTitle.className = "orbitron text-2xl font-bold text-yellow-500";
                    statusDesc.textContent = diff > 0 ? "Pressure values too high! Entities flattened." : "Pressure values too low! Entities drifting.";
                }
            }

            renderSceneBackground();

            // Run core updates on all entity actors
            entities.forEach(ent => {
                ent.update(sliderVal, activePlanet.gravity, isLockPhase);
                ent.draw();
            });

            // Particles system updates
            particles = particles.filter(p => p.alpha > 0);
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            // Handle Green strobe success flash layer
            if (greenFlashDuration > 0) {
                ctx.fillStyle = `rgba(34, 197, 94, ${greenFlashDuration / 35})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                greenFlashDuration--;
            }

            requestAnimationFrame(updateLoop);
        }

        // Initialize App Session Setup execution
        shufflePlanets();
        loadLevel(currentLevelIndex);
        updateLoop();
    </script>
</body>
</html>
